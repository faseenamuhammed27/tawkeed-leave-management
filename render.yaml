# Render Blueprint: managed PostgreSQL 17 + the Dockerised API, served over HTTPS.
# Render dashboard -> New -> Blueprint -> select this repository.
# Secrets are never stored here: JWT_SECRET_KEY is generated by Render, DATABASE_URL is
# injected from the managed database, and SEED_DEMO_PASSWORD is entered in the dashboard.

databases:
  - name: tawkeed-leave-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: tawkeed_leave
    user: tawkeed_app
    ipAllowList: [] # private network only: reachable from Render services, not the internet

services:
  - type: web
    name: tawkeed-leave-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy only after GitHub Actions CI passes
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tawkeed-leave-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_PASSWORD
        sync: false # prompted for in the dashboard, never committed
      - key: RUN_SEED
        value: "true" # idempotent: creates demo data only if missing
      - key: CORS_ORIGINS
        value: https://tawkeed-leave-web.onrender.com # the frontend's URL (Phase 6)
      - key: APP_TIMEZONE
        value: Asia/Dubai
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: MAX_FAILED_LOGINS
        value: "5"
      - key: LOCKOUT_MINUTES
        value: "15"
