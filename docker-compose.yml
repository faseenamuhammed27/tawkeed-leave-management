# Local development stack: PostgreSQL 17 + the FastAPI backend.
#
#   cp .env.example .env      # then fill in the three values
#   docker compose up --build
#
# API:  http://localhost:8000/docs     Postgres: localhost:5433 (5433 avoids clashing with a local install)
# No secrets live in this file; they come from the root .env (git-ignored).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tawkeed_leave
      POSTGRES_USER: tawkeed_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawkeed_app -d tawkeed_leave"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://tawkeed_app:${POSTGRES_PASSWORD}@db:5432/tawkeed_leave
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD in .env}
      RUN_SEED: "true"
      CORS_ORIGINS: http://localhost:5173
      APP_TIMEZONE: Asia/Dubai
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
